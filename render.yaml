services:
  - type: web
    name: mrx-change-backend
    env: node
    rootDir: staff/backend
    buildCommand: cd staff/backend && npm install
    startCommand: cd staff/backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        value: localhost
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        value: ""
      - key: DB_NAME
        value: mr_x_change_staff

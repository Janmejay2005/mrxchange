services:
  # 1. Backend Web Service
  - type: web
    name: mrxchange-backend
    env: node
    rootDir: staff/backend
    buildCommand: npm install && npm run seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: mrxchange-postgres
          property: connectionString

  # 2. Frontend Static Site
  - type: web
    name: mrxchange-frontend
    env: static
    rootDir: staff/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mrxchange-backend
          property: url

databases:
  # 3. PostgreSQL Managed Database
  - name: mrxchange-postgres
    databaseName: mr_x_change_staff
    user: mrx_user

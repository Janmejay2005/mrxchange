services:
  - type: web
    name: mrx-change-backend
    env: node
    rootDir: staff/backend
    buildCommand: cd staff/backend && npm install
    startCommand: cd staff/backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mrx-change-postgres
          property: connectionString

databases:
  - name: mrx-change-postgres
    databaseName: mr_x_change_staff
    user: mrx_user
    plan: free
